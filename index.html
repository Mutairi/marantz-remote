<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Marantz · CINEMA 40</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#131311;color:#efede5;font:15px system-ui,sans-serif}main{max-width:490px;margin:auto;padding:38px 24px}header{text-align:center}header img{width:180px;height:50px;object-fit:contain}.eyebrow{font-size:10px;letter-spacing:3px;color:#aaa697;margin:16px 0 25px}.status{font-size:12px;color:#aaa697;display:flex;justify-content:center;align-items:center;gap:8px}.dot{width:6px;height:6px;background:#a98150;border-radius:50%}.dot.on{background:#a4c59b}.volume{text-align:center;padding:32px 0 23px}.volume strong{font:300 72px/1.2 system-ui;letter-spacing:-4px}.volume small{color:#aaa697;font-size:14px;margin-left:8px}.caption{color:#9c998f;font-size:12px;margin-top:9px}button,select{font:inherit;color:inherit;background:#23231f;border:1px solid #37372f;border-radius:12px;min-height:48px;padding:10px 16px}button{cursor:pointer;transition:background .15s}button:hover{background:#35352e}button:active{background:#4b4537}button:focus-visible,select:focus-visible{outline:2px solid #c6ab7d;outline-offset:3px}button:disabled,select:disabled{opacity:.35;cursor:not-allowed}.volume-controls{display:grid;grid-template-columns:1fr 1.4fr 1fr;gap:10px}.volume-controls button:first-child,.volume-controls button:last-child{font-size:26px}.active{border-color:#c6ab7d!important;color:#e2c99e!important;background:#373125!important}.section{border-top:1px solid #303029;margin-top:27px;padding-top:22px}.label{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:#a9a596;margin-bottom:12px}.power{display:grid;grid-template-columns:1fr 1fr;gap:10px}.selectors{display:grid;grid-template-columns:1fr 1fr;gap:12px}select{width:100%;font-size:13px;padding:10px}.signal{display:flex;justify-content:space-between;font-size:12px;color:#b7b3a7;gap:12px;margin-top:18px}.signal span:last-child{text-align:right;color:#e2c99e}.notice{font-size:12px;min-height:35px;color:#bdb39f;margin-top:20px;line-height:1.5}details{border-top:1px solid #303029;padding-top:16px;margin-top:8px}summary{cursor:pointer;color:#8e8c80;font-size:11px}pre{font-size:11px;line-height:1.7;color:#ada99b;white-space:pre-wrap;max-height:200px;overflow:auto}footer{text-align:center;font-size:10px;color:#67665e;margin-top:28px;letter-spacing:1px}
</style>
<main><header><img src="/logo.svg" alt="marantz"><div class="eyebrow">CINEMA 40 · PERSONAL REMOTE</div><div class="status"><i id="dot" class="dot"></i><span id="status">Connecting to receiver…</span></div></header>
<div class="volume"><strong id="volume">—</strong><small>dB</small><div class="caption">MASTER VOLUME</div></div>
<div class="volume-controls"><button data-command="MVDOWN" aria-label="Volume down">−</button><button id="mute" data-command="MUON">Mute</button><button data-command="MVUP" aria-label="Volume up">+</button></div>
<div class="section"><div class="label">Power</div><div class="power"><button id="on" data-command="PWON">On</button><button id="standby" data-command="PWSTANDBY">Standby</button></div></div>
<div class="section selectors"><label><div class="label">Input</div><select id="input"><option value="" disabled selected>Reading input…</option><option value="TV">TV audio</option><option value="BD">Blu-ray</option><option value="DVD">DVD</option><option value="GAME">Game</option><option value="MPLAY">Media player</option><option value="CD">CD</option><option value="PHONO">Phono</option><option value="NET">Network / HEOS</option></select></label><label><div class="label">Listening mode</div><select id="mode"><option value="" disabled selected>Reading mode…</option><option value="STEREO">Stereo</option><option value="DIRECT">Direct</option><option value="PURE DIRECT">Pure Direct</option><option value="DOLBY DIGITAL">Dolby Surround</option><option value="DTS SURROUND">DTS Neural:X</option><option value="MCH STEREO">Multi Ch Stereo</option></select></label></div>
<div class="signal"><span>Incoming audio</span><span id="format">Waiting for receiver</span></div><div class="signal"><span>Current mode</span><span id="currentmode">—</span></div>
<div class="notice" id="notice" role="status">Controls apply immediately. Available modes depend on the incoming audio.</div><details><summary>Receiver activity</summary><pre id="log">Waiting for updates…</pre></details><footer>10.10.10.40 · LOCAL CONNECTION</footer></main>
<script>
let token='',busy=false,pending=null;const $=id=>document.getElementById(id);
async function command(cmd){try{const r=await fetch('/api/command',{method:'POST',signal:AbortSignal.timeout(4000),headers:{'Content-Type':'application/json','X-Control-Token':token},body:JSON.stringify({command:cmd})});const d=await r.json();if(!r.ok)throw Error(d.error);pending={cmd,time:Date.now()};$('notice').textContent='Sent '+cmd+' · waiting for receiver status.';}catch(e){$('notice').textContent=e.message;}}
document.querySelectorAll('[data-command]').forEach(b=>b.onclick=()=>command(b.dataset.command));$('input').onchange=e=>{e.target.changedAt=Date.now();command('SI'+e.target.value)};$('mode').onchange=e=>{e.target.changedAt=Date.now();command('MS'+e.target.value)};
function selection(id,value){const s=$(id);if(document.activeElement===s&&Date.now()-(s.changedAt||0)<1500)return;const known=Array.from(s.options).find(o=>o.value===value);if(known){s.value=value;return}let o=s.querySelector('[data-current]');if(!o){o=document.createElement('option');o.dataset.current='true';o.disabled=true;s.prepend(o)}o.value=value;o.textContent=value;s.value=value;}
async function refresh(){if(busy)return;busy=true;try{const r=await fetch('/api/status',{cache:'no-store',signal:AbortSignal.timeout(4000)});if(!r.ok)throw Error('Local service unavailable');const s=await r.json();token=s.token;$('dot').classList.toggle('on',s.connected);$('status').textContent=s.connected?'Connected · '+s.power:s.error;document.querySelectorAll('button,select').forEach(x=>x.disabled=!s.connected);$('volume').textContent=s.connected&&s.volume!==null?s.volume.toFixed(1):'—';$('mute').disabled=!s.connected||s.mute===null;$('mute').textContent=s.mute===null?'Reading…':s.mute?'Unmute':'Mute';$('mute').dataset.command=s.mute?'MUOFF':'MUON';$('mute').classList.toggle('active',s.mute===true);$('on').classList.toggle('active',s.power==='On');$('standby').classList.toggle('active',s.power==='Standby');selection('input',s.input);selection('mode',s.mode);$('format').textContent=s.connected?s.format:'—';$('currentmode').textContent=s.connected?s.mode:'—';if(pending&&Date.now()-pending.time>1800){$('notice').textContent='Command sent. Current receiver state is shown above; unsupported commands may be ignored.';pending=null;}$('log').textContent=s.log.map(x=>x.time+'  '+x.text).join('\n');}catch(e){$('status').textContent=e.message;$('dot').classList.remove('on');$('volume').textContent='—';$('format').textContent='—';$('currentmode').textContent='—';document.querySelectorAll('button,select').forEach(x=>x.disabled=true);}finally{busy=false}}
refresh();setInterval(refresh,1000);
</script></html>
