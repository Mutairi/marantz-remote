name: Publish Release
on:
  push:
    branches: [main]
    paths: ['.github/workflows/release.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r windows/requirements.txt
      - run: python -m unittest -v test_server.py
      - name: Build Windows app with Marantz icon
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name Marantz-Remote --icon windows/assets/marantz.ico --paths . --add-data "index.html;." --add-data "logo.svg;." windows/app.py
      - name: Smoke test Windows app
        shell: pwsh
        run: |
          $process = Start-Process ./dist/Marantz-Remote.exe -ArgumentList '--smoke-test' -PassThru
          if (-not $process.WaitForExit(60000)) { $process.Kill(); throw 'Smoke test timed out' }
          if ($process.ExitCode -ne 0) { throw 'Smoke test failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: Marantz-Remote-Windows-Release
          path: |
            dist/Marantz-Remote.exe
            windows/README.md
          if-no-files-found: error
  release:
    needs: windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download tested Windows build
        uses: actions/download-artifact@v4
        with:
          name: Marantz-Remote-Windows-Release
          path: packages/windows
      - name: Download tested Android build
        uses: actions/download-artifact@v4
        with:
          name: Marantz-Remote-Android
          run-id: 39990427148
          github-token: ${{ github.token }}
          path: packages/android
      - name: Package versioned downloads
        run: |
          mkdir -p release
          git archive --format=zip --prefix=Marantz-Remote-Web-v1.2.1/ HEAD index.html logo.svg server.py start.sh README.md docs/browser.md docs/security.md > release/Marantz-Remote-Web-v1.2.1.zip
          cd packages/windows
          zip -r ../../release/Marantz-Remote-Windows-v1.2.1.zip .
          cd ../..
          cp packages/android/app-debug.apk release/Marantz-Remote-Android-v1.2.1.apk
          cd release
          sha256sum *.zip *.apk > SHA256SUMS.txt
      - name: Publish GitHub release
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const tag = 'v1.2.1';
            const body = `Windows now includes the gold Marantz m app icon. Android is unchanged from v1.2.0.\n\nThree downloads for the same local Marantz remote:
            - **Web v1.2.1:** Python 3 source bundle. Extract and run sh start.sh (Windows: python server.py), then open http://127.0.0.1:8765/.
            - **Windows v1.2.1:** Extract and run Marantz-Remote.exe. Windows 10/11 x64; Microsoft Edge WebView2 Runtime required.
            - **Android v1.2.1:** Install the APK on Android 8+. The Android app displays version 1.2 internally.

            Gold interface, volume presets, custom input names, Tone Control/bass, Audyssey LFC/containment, and More Settings. Android uses native controls.

            Windows and Android packages come from successful tested builds. Web source is packaged from this release commit. Real-device GUI and receiver compatibility still need hardware testing. Windows is unsigned; Android is debug-signed and may require uninstalling an older test build with a different signing key. Keep your device and receiver on the same trusted network. No Linux package in this release.

            SHA256SUMS.txt contains download checksums.`;
            const release = await github.rest.repos.createRelease({
              owner: context.repo.owner, repo: context.repo.repo,
              tag_name: tag, target_commitish: context.sha,
              name: 'Marantz Remote v1.2.1 · Web, Windows & Android',
              body, draft: false, prerelease: false
            });
            for (const name of fs.readdirSync('release')) {
              await github.rest.repos.uploadReleaseAsset({
                owner: context.repo.owner, repo: context.repo.repo,
                release_id: release.data.id, name,
                headers: { 'content-type': name.endsWith('.zip') ? 'application/zip' : name.endsWith('.apk') ? 'application/vnd.android.package-archive' : 'text/plain' },
                data: fs.readFileSync('release/' + name)
              });
            }
            // Remove the obsolete release only after every replacement asset is uploaded.
            const obsolete = await github.rest.repos.getReleaseByTag({
              owner: context.repo.owner, repo: context.repo.repo, tag: 'v1.2.0'
            }).catch(error => { if (error.status === 404) return null; throw error; });
            if (obsolete) await github.rest.repos.deleteRelease({
              owner: context.repo.owner, repo: context.repo.repo, release_id: obsolete.data.id
            });
            core.notice(release.data.html_url);
