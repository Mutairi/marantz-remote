name: Publish Release
on:
  push:
    branches: [main]
    paths: ['.github/workflows/release.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r windows/requirements.txt
      - run: python -m unittest -v test_server.py
      - name: Build Windows app with Marantz icon
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name Marantz-Remote --icon windows/assets/marantz.ico --paths . --add-data "index.html;." --add-data "logo.svg;." windows/app.py
      - name: Smoke test Windows app
        shell: pwsh
        run: |
          $process = Start-Process ./dist/Marantz-Remote.exe -ArgumentList '--smoke-test' -PassThru
          if (-not $process.WaitForExit(60000)) { $process.Kill(); throw 'Smoke test timed out' }
          if ($process.ExitCode -ne 0) { throw 'Smoke test failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: Marantz-Remote-Windows-v1.3
          path: dist/Marantz-Remote.exe
          if-no-files-found: error
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build, test and lint Android v1.3
        working-directory: android
        run: gradle --no-daemon testDebugUnitTest lintDebug assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Marantz-Remote-Android-v1.3
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest -v test_server.py
      - run: python test_browser.py
  release:
    needs: [windows, android, browser]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Marantz-Remote-Windows-v1.3
          path: packages/windows
      - uses: actions/download-artifact@v4
        with:
          name: Marantz-Remote-Android-v1.3
          path: packages/android
      - name: Package versioned downloads
        run: |
          mkdir -p release
          git archive --format=zip --prefix=Marantz-Remote-Web-v1.3/ HEAD index.html logo.svg server.py start.sh README.md docs/browser.md docs/security.md > release/Marantz-Remote-Web-v1.3.zip
          zip -j release/Marantz-Remote-Windows-v1.3.zip packages/windows/Marantz-Remote.exe
          test "$(unzip -Z1 release/Marantz-Remote-Windows-v1.3.zip)" = 'Marantz-Remote.exe'
          cp packages/android/app-debug.apk release/Marantz-Remote-Android-v1.3.apk
          cd release
          sha256sum *.zip *.apk > SHA256SUMS.txt
      - name: Upload assets and publish v1.3
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const tag = 'v1.3';
            const body = `Live INPUT and OUTPUT speaker diagrams are now available on Windows, Android, and web.

            Active channels glow gold; inactive channels are dimmed. The diagrams update automatically from the receiver, including surround, back, subwoofer, and height channels when reported. Unsupported or stale channel readings show Unavailable. SW is the receiver's combined subwoofer indicator.

            **Windows:** Download the Windows ZIP, extract it, and open Marantz-Remote.exe. No installation needed. Close the previous app first.
            **Android:** Download and install the APK.
            **Linux / web:** Extract the Web ZIP, run python3 server.py, and open http://127.0.0.1:8765/.

            Keep your device and receiver on the same network. Live channel data was checked on a CINEMA 40; Windows desktop testing is ready for you. Windows startup checks, browser tests, and Android tests/lint/build must pass before this release publishes.

            Windows requires WebView2 and is unsigned. Android is debug-signed. SHA256SUMS.txt contains download checksums.`;
            const repo = { owner: context.repo.owner, repo: context.repo.repo };
            const releases = await github.paginate(github.rest.repos.listReleases, { ...repo, per_page: 100 });
            let release = { data: releases.find(item => item.tag_name === tag) };
            if (release.data) {
              if (!release.data.draft) throw new Error('v1.3 is already published; do not replace published downloads');
              if (release.data.target_commitish !== context.sha) throw new Error('Existing draft targets different source');
            } else {
              release = await github.rest.repos.createRelease({ ...repo,
                tag_name: tag, target_commitish: context.sha,
                name: 'Marantz Remote v1.3', body, draft: true, prerelease: false
              });
            }
            const existing = await github.rest.repos.listReleaseAssets({ ...repo, release_id: release.data.id });
            for (const name of fs.readdirSync('release')) {
              const previous = existing.data.find(asset => asset.name === name);
              if (previous) await github.rest.repos.deleteReleaseAsset({ ...repo, asset_id: previous.id });
              await github.rest.repos.uploadReleaseAsset({ ...repo,
                release_id: release.data.id, name,
                headers: { 'content-type': name.endsWith('.zip') ? 'application/zip' : name.endsWith('.apk') ? 'application/vnd.android.package-archive' : 'text/plain' },
                data: fs.readFileSync('release/' + name)
              });
            }
            await github.rest.repos.updateRelease({ ...repo, release_id: release.data.id,
              name: 'Marantz Remote v1.3', body, draft: false, make_latest: 'true'
            });
            core.notice('https://github.com/' + context.repo.owner + '/' + context.repo.repo + '/releases/tag/' + tag);
