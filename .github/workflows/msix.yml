name: Windows Store MSIX
on:
  push:
    branches: [main]
    paths: ['windows/**', '.github/workflows/msix.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r windows/requirements.txt
      - run: python -m unittest -v test_server.py
      - name: Build executable with Marantz icon
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name Marantz-Remote --icon windows/assets/marantz.ico --paths . --add-data "index.html;." --add-data "logo.svg;." windows/app.py
      - name: Smoke test executable
        shell: pwsh
        run: |
          $process = Start-Process -FilePath ./dist/Marantz-Remote.exe -ArgumentList '--smoke-test' -PassThru
          if (-not $process.WaitForExit(60000)) { $process.Kill(); throw 'Smoke test timed out' }
          if ($process.ExitCode -ne 0) { throw 'Smoke test failed' }
      - name: Build and validate Store package
        shell: pwsh
        run: ./windows/msix/build.ps1 -IdentityName 'throy.MarantzRemotebyTHROY' -Publisher 'CN=E25A6066-EC06-4D85-9939-64463C14B4CB' -PublisherDisplayName 'throy'
      - uses: actions/upload-artifact@v4
        with:
          name: Marantz-Remote-Store-MSIX-1.2.1.0
          path: dist/*.msix
          if-no-files-found: error
          retention-days: 30
