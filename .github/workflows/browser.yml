name: Browser Checks
on:
  push:
    paths: ['server.py', 'test_server.py', 'test_browser.py', 'index.html', '.github/workflows/browser.yml']
  pull_request:
    paths: ['server.py', 'test_server.py', 'test_browser.py', 'index.html', '.github/workflows/browser.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest -v test_server.py
      - run: python test_browser.py
